name: Hourly stock news sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  pulse-stock-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger application stock news update
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required"
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST "$APP_BASE_URL/tasks/update-stock-news" \
            -H "X-Cron-Token: $CRON_TOKEN" \
            -H "Content-Type: application/json"
